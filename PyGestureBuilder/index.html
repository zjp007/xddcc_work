<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PyGestureBuilder | 工业级动作数据采集与机器学习训练平台</title>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <style>
        /* ... 保留之前的全局和霓虹背景样式 ... */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #0a0f1d; color: #e2e8f0; font-family: 'Segoe UI', system-ui, sans-serif; overflow-x: hidden; }
        .cyber-bg { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: radial-gradient(circle at 50% 50%, #1a233a 0%, #0a0f1d 100%); z-index: -1; }
        .cyber-grid { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-image: linear-gradient(rgba(16, 185, 129, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(16, 185, 129, 0.03) 1px, transparent 1px); background-size: 40px 40px; z-index: -1; }
        header { padding: 40px 20px; text-align: center; max-width: 1200px; margin: 0 auto; }
        .logo-text { font-size: 2.5rem; font-weight: 800; background: linear-gradient(45deg, #10b981, #3b82f6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 2px; }
        
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .download-panel { background: linear-gradient(135deg, rgba(15, 23, 42, 0.8) 0%, rgba(30, 41, 59, 0.8) 100%); border: 2px solid rgba(59, 130, 246, 0.2); border-radius: 16px; padding: 40px; text-align: center; max-width: 600px; margin: 40px auto; backdrop-filter: blur(20px); }
        .download-panel h2 { font-size: 1.8rem; margin-bottom: 15px; color: #ffffff; }
        
        /* 🚀 新增：OS 平台选择器样式 */
        .os-selector { display: flex; justify-content: center; gap: 15px; margin-bottom: 25px; }
        .os-option { position: relative; cursor: pointer; }
        .os-option input { display: none; }
        .os-card { background: rgba(15, 23, 42, 0.5); border: 2px solid #334155; padding: 15px 25px; border-radius: 10px; color: #94a3b8; font-weight: 600; transition: all 0.3s ease; display: flex; align-items: center; gap: 8px; }
        .os-option input:checked + .os-card { border-color: #3b82f6; background: rgba(59, 130, 246, 0.15); color: #ffffff; box-shadow: 0 0 15px rgba(59, 130, 246, 0.3); }
        .os-option input:hover + .os-card:not(.checked) { border-color: #475569; }

        .turnstile-wrapper { display: flex; justify-content: center; margin-bottom: 25px; }
        .cyber-btn { background: linear-gradient(90deg, #10b981, #059669); color: #ffffff; border: none; padding: 15px 40px; font-size: 1.1rem; font-weight: 600; border-radius: 8px; cursor: pointer; letter-spacing: 1px; transition: all 0.3s ease; width: 100%; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3); }
        .cyber-btn:hover { background: linear-gradient(90deg, #059669, #10b981); box-shadow: 0 6px 20px rgba(16, 185, 129, 0.5); }
        .cyber-btn:disabled { background: #334155; color: #64748b; cursor: not-allowed; box-shadow: none; }

        .result-box { margin-top: 20px; padding: 15px; border-radius: 8px; display: none; font-size: 0.95rem; word-break: break-all; }
        .success-box { background: rgba(16, 185, 129, 0.15); border: 1px solid #10b981; color: #34d399; }
        .error-box { background: rgba(239, 68, 68, 0.15); border: 1px solid #ef4444; color: #f87171; }
        .countdown { font-weight: bold; text-decoration: underline; color: #ffffff; }
    </style>
</head>
<body>
    <div class="cyber-bg"></div>
    <div class="cyber-grid"></div>

    <header>
        <div class="logo-text">PyGestureBuilder</div>
    </header>

    <div class="container">
        <div class="download-panel">
            <h2>安全下载通道</h2>
            <p style="color: #94a3b8; margin-bottom: 25px;">请选择您的操作系统，通过边缘安全检测后将派发高速下载链接。</p>
            
            <form id="download-form">
                <div class="os-selector">
                    <label class="os-option">
                        <input type="radio" name="os" value="windows" id="os-win" checked>
                        <div class="os-card">🪟 Windows (x64)</div>
                    </label>
                    <label class="os-option">
                        <input type="radio" name="os" value="mac" id="os-mac">
                        <div class="os-card">🍎 macOS (Apple Silicon)</div>
                    </label>
                </div>

                <div class="turnstile-wrapper">
                    <div class="cf-turnstile" data-sitekey="0x4AAAAAAD4c9NaCjJyLy_sb" data-callback="onTurnstileSuccess" data-expired-callback="onTurnstileExpired"></div>
                </div>
                
                <button type="submit" id="download-submit" class="cyber-btn" disabled>请求派发安全链接</button>
            </form>

            <div id="status-result" class="result-box"></div>
        </div>
    </div>

    <script>
        // 🚀 智能系统嗅探：自动切换默认选项
        document.addEventListener('DOMContentLoaded', () => {
            const userAgent = window.navigator.userAgent.toLowerCase();
            const platform = window.navigator.platform.toLowerCase();
            // 如果检测到是 Mac，自动将 macOS 单选框设为选中
            if (userAgent.indexOf("mac") !== -1 || platform.indexOf("mac") !== -1) {
                document.getElementById("os-mac").checked = true;
            }
        });

        let turnstileToken = "";
        const submitBtn = document.getElementById("download-submit");
        const resultBox = document.getElementById("status-result");

        function onTurnstileSuccess(token) {
            turnstileToken = token;
            submitBtn.disabled = false;
        }

        function onTurnstileExpired() {
            turnstileToken = "";
            submitBtn.disabled = true;
            showMsg("验证已过期，请重新进行人机校验", "error");
        }

        document.getElementById("download-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            if (!turnstileToken) return;

            // 获取用户当前选中的操作系统
            const selectedOS = document.querySelector('input[name="os"]:checked').value;

            submitBtn.disabled = true;
            submitBtn.innerText = "边缘安全中枢校验中...";

            try {
                // 🚀 将 token 和 os 一起发给 Worker
                const response = await fetch("https://api.pygb.ccwu.cc/generate-link", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ 
                        token: turnstileToken,
                        os: selectedOS 
                    })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    const osName = selectedOS === "mac" ? "macOS (Apple Silicon) .pkg" : "Windows .zip";
                    showMsg(`校验通过！专属下载链接已激活：<br><br>
                             <a href="${data.downloadUrl}" style="background:#10b981; color:#fff; padding: 10px 20px; border-radius: 5px; text-decoration: none; display: inline-block; margin-bottom:15px; font-weight:bold;" target="_blank">
                                ⬇️ 下载 PyGestureBuilder for ${osName}
                             </a><br>
                             ⚠️ 该安全链接包含时效加密签名，将在 <span id="timer" class="countdown">10:00</span> 后失效。`, "success");
                    startCountdown(600);
                } else {
                    showMsg(`安全中枢拒绝了请求：${data.message}`, "error");
                    if(window.turnstile) turnstile.reset();
                }
            } catch (err) {
                showMsg("网络鉴权链路通讯异常，请稍后重试", "error");
                if(window.turnstile) turnstile.reset();
            } finally {
                submitBtn.innerText = "请求派发安全链接";
            }
        });

        function showMsg(html, type) {
            resultBox.innerHTML = html;
            resultBox.className = `result-box ${type === 'success' ? 'success-box' : 'error-box'}`;
            resultBox.style.display = "block";
        }

        function startCountdown(seconds) {
            let remaining = seconds;
            const timerEl = document.getElementById("timer");
            const interval = setInterval(() => {
                remaining--;
                if (remaining <= 0) {
                    clearInterval(interval);
                    showMsg("该安全下载链接已超过 10 分钟时效，签名失效。请刷新页面重新进行人机校验。", "error");
                    if(window.turnstile) turnstile.reset();
                } else {
                    const m = Math.floor(remaining / 60).toString().padStart(2, '0');
                    const s = (remaining % 60).toString().padStart(2, '0');
                    if(timerEl) timerEl.innerText = `${m}:${s}`;
                }
            }, 1000);
        }
    </script>
</body>
</html>
